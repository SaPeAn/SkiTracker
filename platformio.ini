; SkiTracker — GPS-трекер для беговых лыж
; Плата: LILYGO TTGO T-Display (ESP32, экран ST7789 135x240)

[platformio]
default_envs = tdisplay

[env:tdisplay]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; 2 МБ под прошивку, ~1.9 МБ под треки (OTA не используется)
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ~1.4.3
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; --- NimBLE: нужен только central/observer (подключение к пульсометру)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; --- TFT_eSPI: настройки T-Display (аналог Setup25_TTGO_T_Display)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_SDA_READ=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000

; Проверка Wi-Fi/HTTP на самой плате: pio run -e selftest -t upload, результат в Serial.
; Создаёт и удаляет только собственный файл selftest.csv. После — залить обычную прошивку.
[env:selftest]
extends = env:tdisplay
build_flags =
    ${env:tdisplay.build_flags}
    -DSELFTEST
